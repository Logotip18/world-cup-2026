<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЧМ-2026: Прогнозы | ЛОГОТИП 18+</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0000 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            color: #ff0000;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.7);
            margin-bottom: 30px;
            font-size: 3em;
            letter-spacing: 5px;
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(255, 0, 0, 0.5); }
            to { text-shadow: 0 0 40px rgba(255, 0, 0, 1), 0 0 60px rgba(255, 0, 0, 0.8); }
        }
        
        .section {
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #8B0000;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 0 40px rgba(139, 0, 0, 0.4);
        }
        
        .section-title {
            font-family: 'Orbitron', sans-serif;
            color: #ff0000;
            font-size: 1.8em;
            margin-bottom: 20px;
            border-bottom: 3px solid #8B0000;
            padding-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        th, td {
            padding: 15px;
            text-align: center;
            border: 1px solid #333;
        }
        
        th {
            background: linear-gradient(135deg, #8B0000 0%, #ff0000 100%);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        tr:nth-child(even) {
            background: rgba(40, 40, 40, 0.6);
        }
        
        tr:hover {
            background: rgba(139, 0, 0, 0.3);
            transform: scale(1.01);
            transition: all 0.3s;
        }
        
        input[type="text"], input[type="number"], input[type="datetime-local"] {
            background: #1a1a1a;
            border: 2px solid #8B0000;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1em;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s;
        }
        
        input[type="text"]:focus, input[type="number"]:focus, input[type="datetime-local"]:focus {
            outline: none;
            border-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
        }
        
        button {
            background: linear-gradient(135deg, #8B0000 0%, #ff0000 100%);
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1em;
            transition: all 0.3s;
            margin: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(139, 0, 0, 0.4);
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(255, 0, 0, 0.7);
        }
        
        button.delete {
            background: linear-gradient(135deg, #ff0000 0%, #8B0000 100%);
            padding: 10px 20px;
            font-size: 1em;
            border: 2px solid #ff0000;
        }
        
        button.delete:hover {
            background: linear-gradient(135deg, #ff3333 0%, #ff0000 100%);
            border-color: #ff3333;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #333;
        }
        
        .match-info {
            flex: 1;
        }
        
        .match-date {
            font-size: 0.9em;
            color: #888;
            margin-bottom: 5px;
        }
        
        .match-teams {
            font-size: 1.4em;
            font-weight: 700;
            color: #fff;
            margin-bottom: 5px;
        }
        
        .match-group {
            font-size: 1em;
            color: #ff0000;
            font-weight: 600;
        }
        
        .match-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .result-input {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 1.2em;
        }
        
        .result-input input {
            width: 70px;
            font-size: 1.3em;
            font-weight: 700;
        }
        
        .predictions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .player-prediction {
            background: rgba(30, 30, 30, 0.8);
            border: 2px solid #333;
            border-radius: 10px;
            padding: 15px;
            transition: all 0.3s;
        }
        
        .player-prediction:hover {
            border-color: #8B0000;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(139, 0, 0, 0.4);
        }
        
        .player-name {
            font-family: 'Orbitron', sans-serif;
            color: #ff0000;
            font-size: 1.2em;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .prediction-score {
            font-size: 1.3em;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .prediction-score input {
            width: 60px;
        }
        
        .points-earned {
            font-size: 1em;
            color: #00ff00;
            font-weight: 600;
            text-align: center;
            padding: 5px;
            border-radius: 5px;
            background: rgba(0, 255, 0, 0.1);
        }
        
        .points-earned.zero {
            color: #666;
            background: rgba(100, 100, 100, 0.1);
        }
        
        .points-earned.three {
            color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
            font-weight: 700;
        }
        
        .points-earned.two {
            color: #00ffff;
            background: rgba(0, 255, 255, 0.2);
        }
        
        .points-earned.one {
            color: #90EE90;
            background: rgba(144, 238, 144, 0.2);
        }
        
        .leaderboard td:first-child {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: #ff0000;
            font-size: 1.2em;
        }
        
        .leaderboard tr:nth-child(1) {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.3) 0%, rgba(255, 215, 0, 0.1) 100%);
        }
        
        .leaderboard tr:nth-child(2) {
            background: linear-gradient(135deg, rgba(192, 192, 192, 0.3) 0%, rgba(192, 192, 192, 0.1) 100%);
        }
        
        .leaderboard tr:nth-child(3) {
            background: linear-gradient(135deg, rgba(205, 127, 50, 0.3) 0%, rgba(205, 127, 50, 0.1) 100%);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, rgba(139, 0, 0, 0.3) 0%, rgba(139, 0, 0, 0.1) 100%);
            border: 2px solid #8B0000;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.3);
        }
        
        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5em;
            color: #ff0000;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
        }
        
        .stat-label {
            font-size: 1em;
            color: #aaa;
            margin-top: 8px;
            font-weight: 600;
        }
        
        .rules {
            background: rgba(139, 0, 0, 0.2);
            border: 2px solid #8B0000;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
        }
        
        .rules-title {
            font-family: 'Orbitron', sans-serif;
            color: #ff0000;
            font-size: 1.3em;
            margin-bottom: 10px;
        }
        
        .rules-list {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .rule-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1em;
        }
        
        .rule-points {
            background: #8B0000;
            color: #fff;
            padding: 5px 12px;
            border-radius: 5px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚽ ЧМ-2026: ПРОГНОЗЫ ⚽</h1>
        
        <div class="rules">
            <div class="rules-title">📋 ПРАВИЛА НАЧИСЛЕНИЯ ОЧКОВ:</div>
            <div class="rules-list">
                <div class="rule-item">
                    <span class="rule-points">3 балла</span>
                    <span>Точный счёт</span>
                </div>
                <div class="rule-item">
                    <span class="rule-points">2 балла</span>
                    <span>Угадана разница</span>
                </div>
                <div class="rule-item">
                    <span class="rule-points">1 балл</span>
                    <span>Угадан исход</span>
                </div>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">📅 Матчи ЧМ-2026</div>
            <div class="controls">
                <button onclick="addMatch()">+ Добавить матч</button>
                <button onclick="clearAllPredictions()">🗑️ Очистить все прогнозы</button>
            </div>
            <div id="matchesList"></div>
        </div>
        
        <div class="section">
            <div class="section-title">🏆 Таблица лидеров</div>
            <table class="leaderboard">
                <thead>
                    <tr>
                        <th>🏅 Место</th>
                        <th>👤 Игрок</th>
                        <th>⭐ Очки</th>
                        <th>🎯 Точных (3)</th>
                        <th>📊 Разница (2)</th>
                        <th>✔️ Исходов (1)</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody"></tbody>
            </table>
        </div>
        
        <div class="section">
            <div class="section-title">📈 Статистика</div>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="totalMatches">0</div>
                    <div class="stat-label">Всего матчей</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="completedMatches">0</div>
                    <div class="stat-label">Сыграно</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalPlayers">4</div>
                    <div class="stat-label">Игроков</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalPredictions">0</div>
                    <div class="stat-label">Прогнозов</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let data = {
            matches: [],
            players: ['Сергей', 'ИИ', 'Владеп', 'АлПашка']
        };
        
        // Загрузка из localStorage
        function loadData() {
            const saved = localStorage.getItem('worldCup2026_v3');
            if (saved) {
                data = JSON.parse(saved);
            } else {
                // Добавляем реальные матчи ЧМ-2026 при первом запуске
                loadRealMatches();
            }
        }
        
        // Сохранение в localStorage
        function saveData() {
            localStorage.setItem('worldCup2026_v3', JSON.stringify(data));
        }
        
        // Загрузка реальных матчей ЧМ-2026
        function loadRealMatches() {
            const realMatches = [
                { date: '11 июня', time: '22:00', team1: 'Мексика', team2: 'ЮАР', group: 'Группа А' },
                { date: '12 июня', time: '05:00', team1: 'Южная Корея', team2: 'Чехия', group: 'Группа А' },
                { date: '12 июня', time: '22:00', team1: 'Канада', team2: 'Босния', group: 'Группа B' },
                { date: '13 июня', time: '04:00', team1: 'США', team2: 'Парагвай', group: 'Группа D' },
                { date: '13 июня', time: '22:00', team1: 'Катар', team2: 'Швейцария', group: 'Группа B' },
                { date: '14 июня', time: '01:00', team1: 'Бразилия', team2: 'Марокко', group: 'Группа C' },
                { date: '14 июня', time: '04:00', team1: 'Гаити', team2: 'Шотландия', group: 'Группа C' },
                { date: '14 июня', time: '07:00', team1: 'Австралия', team2: 'Турция', group: 'Группа D' },
                { date: '14 июня', time: '20:00', team1: 'Германия', team2: 'Кюрасао', group: 'Группа E' },
                { date: '14 июня', time: '23:00', team1: 'Нидерланды', team2: 'Япония', group: 'Группа F' },
                { date: '15 июня', time: '02:00', team1: "Кот-д'Ивуар", team2: 'Эквадор', group: 'Группа E' },
                { date: '15 июня', time: '05:00', team1: 'Швеция', team2: 'Тунис', group: 'Группа F' },
                { date: '15 июня', time: '19:00', team1: 'Испания', team2: 'Кабо-Верде', group: 'Группа Н' },
                { date: '15 июня', time: '22:00', team1: 'Бельгия', team2: 'Египет', group: 'Группа G' },
                { date: '16 июня', time: '01:00', team1: 'Саудовская Аравия', team2: 'Уругвай', group: 'Группа Н' },
                { date: '16 июня', time: '04:00', team1: 'Иран', team2: 'Новая Зеландия', group: 'Группа G' },
                { date: '16 июня', time: '22:00', team1: 'Франция', team2: 'Сенегал', group: 'Группа I' },
                { date: '17 июня', time: '01:00', team1: 'Ирак', team2: 'Норвегия', group: 'Группа I' },
                { date: '17 июня', time: '04:00', team1: 'Аргентина', team2: 'Алжир', group: 'Группа J' },
                { date: '17 июня', time: '07:00', team1: 'Австрия', team2: 'Иордания', group: 'Группа J' },
                { date: '17 июня', time: '20:00', team1: 'Португалия', team2: 'ДР Конго', group: 'Группа K' },
                { date: '17 июня', time: '23:00', team1: 'Англия', team2: 'Хорватия', group: 'Группа L' },
                { date: '18 июня', time: '02:00', team1: 'Гана', team2: 'Панама', group: 'Группа L' },
                { date: '18 июня', time: '05:00', team1: 'Узбекистан', team2: 'Колумбия', group: 'Группа K' }
            ];
            
            realMatches.forEach(match => {
                data.matches.push({
                    date: match.date,
                    time: match.time,
                    team1: match.team1,
                    team2: match.team2,
                    group: match.group,
                    predictions: {},
                    result: { team1: null, team2: null }
                });
            });
            
            saveData();
        }
        
        // Добавление матча
        function addMatch() {
            data.matches.push({
                date: '',
                time: '',
                team1: '',
                team2: '',
                group: '',
                predictions: {},
                result: { team1: null, team2: null }
            });
            saveData();
            render();
        }
        
        // Удаление матча
        function deleteMatch(index) {
            if (confirm(`Удалить матч: ${data.matches[index].team1} vs ${data.matches[index].team2}?`)) {
                data.matches.splice(index, 1);
                saveData();
                render();
            }
        }
        
        // Обновление матча
        function updateMatch(index, field, value) {
            data.matches[index][field] = value;
            saveData();
        }
        
        // Обновление прогноза
        function updatePrediction(matchIndex, player, team, value) {
            if (!data.matches[matchIndex].predictions[player]) {
                data.matches[matchIndex].predictions[player] = { team1: null, team2: null };
            }
            data.matches[matchIndex].predictions[player][team] = value === '' ? null : parseInt(value);
            saveData();
            updateLeaderboard();
        }
        
        // Обновление результата
        function updateResult(matchIndex, team, value) {
            data.matches[matchIndex].result[team] = value === '' ? null : parseInt(value);
            saveData();
            updateLeaderboard();
        }
        
        // Подсчет очков (система 3-2-1)
        function calculatePoints() {
            const stats = {};
            data.players.forEach(player => {
                stats[player] = { points: 0, exact: 0, diff: 0, outcome: 0 };
            });
            
            data.matches.forEach(match => {
                if (match.result.team1 !== null && match.result.team2 !== null) {
                    const realDiff = match.result.team1 - match.result.team2;
                    
                    data.players.forEach(player => {
                        const pred = match.predictions[player];
                        if (pred && pred.team1 !== null && pred.team2 !== null) {
                            const predDiff = pred.team1 - pred.team2;
                            
                            // Точный счет - 3 балла
                            if (pred.team1 === match.result.team1 && pred.team2 === match.result.team2) {
                                stats[player].points += 3;
                                stats[player].exact += 1;
                            }
                            // Угадана разница - 2 балла
                            else if (predDiff === realDiff) {
                                stats[player].points += 2;
                                stats[player].diff += 1;
                            }
                            // Угадан исход - 1 балл
                            else if (Math.sign(predDiff) === Math.sign(realDiff)) {
                                stats[player].points += 1;
                                stats[player].outcome += 1;
                            }
                        }
                    });
                }
            });
            
            return stats;
        }
        
        // Обновление таблицы лидеров
        function updateLeaderboard() {
            const stats = calculatePoints();
            const sorted = Object.entries(stats).sort((a, b) => b[1].points - a[1].points);
            
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = sorted.map((entry, index) => {
                const [player, stat] = entry;
                return `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${player}</td>
                        <td><strong>${stat.points}</strong></td>
                        <td>${stat.exact}</td>
                        <td>${stat.diff}</td>
                        <td>${stat.outcome}</td>
                    </tr>
                `;
            }).join('');
            
            // Обновление статистики
            document.getElementById('totalMatches').textContent = data.matches.length;
            document.getElementById('completedMatches').textContent = data.matches.filter(m => 
                m.result.team1 !== null && m.result.team2 !== null
            ).length;
            document.getElementById('totalPlayers').textContent = data.players.length;
            
            let totalPred = 0;
            data.matches.forEach(m => {
                totalPred += Object.keys(m.predictions).length;
            });
            document.getElementById('totalPredictions').textContent = totalPred;
        }
        
        // Очистка всех прогнозов
        function clearAllPredictions() {
            if (confirm('Очистить ВСЕ прогнозы? Результаты матчей останутся.')) {
                data.matches.forEach(match => {
                    match.predictions = {};
                });
                saveData();
                render();
            }
        }
        
        // Определение класса для очков
        function getPointsClass(points) {
            if (points === 0) return 'zero';
            if (points === 3) return 'three';
            if (points === 2) return 'two';
            if (points === 1) return 'one';
            return 'zero';
        }
        
        // Рендеринг
        function render() {
            const matchesList = document.getElementById('matchesList');
            
            if (data.matches.length === 0) {
                matchesList.innerHTML = '<p style="text-align: center; color: #666; padding: 30px; font-size: 1.2em;">Матчей пока нет. Нажмите "+ Добавить матч"</p>';
                updateLeaderboard();
                return;
            }
            
            matchesList.innerHTML = data.matches.map((match, index) => {
                const result = match.result;
                const resultText = (result.team1 !== null && result.team2 !== null) 
                    ? `${result.team1}:${result.team2}` 
                    : 'не сыгран';
                
                return `
                    <div class="section" style="margin-bottom: 20px;">
                        <div class="match-header">
                            <div class="match-info">
                                <div class="match-date">📅 ${match.date || 'Дата'} ${match.time ? 'в ' + match.time : ''}</div>
                                <div class="match-teams">${match.team1 || 'Команда 1'} <span style="color: #666;">vs</span> ${match.team2 || 'Команда 2'}</div>
                                <div class="match-group">${match.group || ''}</div>
                            </div>
                            <div class="match-actions">
                                <div class="result-input">
                                    <span style="color: #888;">Счёт:</span>
                                    <input type="number" min="0" placeholder="0" value="${result.team1 !== null ? result.team1 : ''}" 
                                           onchange="updateResult(${index}, 'team1', this.value)">
                                    <span>:</span>
                                    <input type="number" min="0" placeholder="0" value="${result.team2 !== null ? result.team2 : ''}" 
                                           onchange="updateResult(${index}, 'team2', this.value)">
                                </div>
                                <button class="delete" onclick="deleteMatch(${index})">🗑️ Удалить матч</button>
                            </div>
                        </div>
                        
                        <div style="color: #ff0000; font-weight: 700; margin-bottom: 15px; font-size: 1.1em;">📝 Прогнозы участников:</div>
                        <div class="predictions-grid">
                            ${data.players.map(player => {
                                const pred = match.predictions[player] || { team1: '', team2: '' };
                                let points = 0;
                                
                                if (result.team1 !== null && result.team2 !== null && 
                                    pred.team1 !== null && pred.team2 !== null) {
                                    const realDiff = result.team1 - result.team2;
                                    const predDiff = pred.team1 - pred.team2;
                                    
                                    if (pred.team1 === result.team1 && pred.team2 === result.team2) {
                                        points = 3;
                                    } else if (predDiff === realDiff) {
                                        points = 2;
                                    } else if (Math.sign(predDiff) === Math.sign(realDiff)) {
                                        points = 1;
                                    }
                                }
                                
                                const pointsText = points === 3 ? '+3 балла (ТОЧНО!)' : 
                                                   points === 2 ? '+2 балла (разница)' : 
                                                   points === 1 ? '+1 балл (исход)' : '0 баллов';
                                
                                return `
                                    <div class="player-prediction">
                                        <div class="player-name">${player}</div>
                                        <div class="prediction-score">
                                            <input type="number" min="0" placeholder="0" value="${pred.team1 || ''}" 
                                                   onchange="updatePrediction(${index}, '${player}', 'team1', this.value)">
                                            <span>:</span>
                                            <input type="number" min="0" placeholder="0" value="${pred.team2 || ''}" 
                                                   onchange="updatePrediction(${index}, '${player}', 'team2', this.value)">
                                        </div>
                                        <div class="points-earned ${getPointsClass(points)}">
                                            ${pointsText}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');
            
            updateLeaderboard();
        }
        
        // Инициализация
        loadData();
        render();
    </script>
</body>
</html>
